<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />
	<title>Curve Calulator</title>
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<meta name="description" content="" />
	<link href="https://cdn.jsdelivr.net/npm/modern-normalize@v3.0.1/modern-normalize.min.css" rel="stylesheet" />
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
		crossorigin="anonymous" />
	<link rel="stylesheet" type="text/css" href="curveCalculator.css" />
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link
		href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=Fira+Mono:wght@400;500;700&display=swap"
		rel="stylesheet">
	<link rel="icon" href="favicon.png" />
</head>

<body>
	<!-- Navbar -->
	<nav class="navbar navbar-expand-lg bg-body-tertiary">
		<div class="container-fluid">
			<a class="navbar-brand" href="#">
				<img src="Magnum Logo.png" alt="Magnum Manufacturing Logo" height="36"
					class="d-inline-block align-text-top" />
			</a>
			<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown"
				aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
				<span class="navbar-toggler-icon"></span>
			</button>
			<div class="collapse navbar-collapse" id="navbarNavDropdown">
				<ul class="navbar-nav">
					<li class="nav-item">
						<a class="nav-link active" aria-current="page" href="#">Home</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" href="#">Curve Calculator</a>
					</li>
					<li class="nav-item">
						<a class="nav-link" href="#">Tie Spacing</a>
					</li>
				</ul>
			</div>
		</div>
	</nav>
	<main class="container">

		<h1>Curve Calculator</h1>
		<div class="container-fluid">

			<!-- Settings Row -->
			<div class="row">

				<!-- Panel Column -->
				<div class="col">
					<!-- Panel Type -->
					<div class="">
						<label for="panelType" class="form-label">Panel Type</label>
						<select class="form-select" id="panelType">
							<!-- Commented here becase the js file builds the options dynamically
                            <option value="0201"         >0201</option>
                            <option value="0202"         >0202</option>
                            <option value="1300"         >1300</option>
                            <option value="1301" selected>1301</option>
                            <option value="1310"         >1310</option>
                            <option value="1315"         >1315</option> -->
						</select>
					</div>

					<!-- Gage Type -->
					<div id="gageType" data-value="">
						<div class="form-check">
							<input class="form-check-input" type="radio" name="gageType" id="gageTypeStandard"
								value="standard" checked>
							<label class="form-check-label" for="gageTypeStandard">Standard</label>
						</div>
						<div class="form-check">
							<input class="form-check-input" type="radio" name="gageType" id="gageTypePedestrian"
								value="pedestrian">
							<label class="form-check-label" for="gageTypePedestrian">Pedestrian</label>
						</div>
					</div>

					<!-- Panel Length -->
					<div class="">
						<label for="panelLength" class="form-label">Panel Length (ft)</label>
						<input type="number" class="form-control" id="panelLength" placeholder="Enter length in feet">
					</div>

					<!-- Gage Width -->
					<div class="">
						<label for="gageWidth" class="form-label">Gage Width (ft)</label>
						<input type="number" class="form-control" id="gageWidth" placeholder="Enter width in inches"
							disabled>
					</div>

					<!-- Field Width -->
					<div class="">
						<label for="fieldWidth" class="form-label">Field Width (ft)</label>
						<input type="number" class="form-control" id="fieldWidth" placeholder="Enter width in feet">
					</div>
				</div>

				<!-- Rail Column -->
				<div class="col">
					<!-- Rail Size -->
					<div class="">
						<label for="railSize" class="form-label">Rail Size</label>
						<select class="form-select" id="railSize">
							<!-- Commented here because the js file builds the options dynamically
                            <option value="90"          >#90</option>
                            <option value="100"         >#100</option>
                            <option value="115"         >#115</option>
                            <option value="119"         >#119</option>
                            <option value="132"         >#132</option>
                            <option value="133" selected>#133</option>
                            <option value="136"         >#136</option>
                            <option value="140"         >#140</option>
                            <option value="141"         >#141</option> -->
						</select>
					</div>

					<!-- Field Rubber Width -->
					<div class="">
						<label for="fieldRubberWidth" class="form-label">Field Rubber Width</label>
						<input type="number" class="form-control" id="fieldRubberWidth"
							placeholder="Enter width in inches">
					</div>

					<!-- Rail Head Width -->
					<div class="">
						<label for="railHeadWidth" class="form-label">Rail Head Width</label>
						<input type="number" class="form-control" id="railHeadWidth"
							placeholder="Enter width in inches">
					</div>

					<!-- Gage Rubber Width -->
					<div class="">
						<label for="gageRubberWidth" class="form-label">Gage Rubber Width</label>
						<input type="number" class="form-control" id="gageRubberWidth"
							placeholder="Enter width in inches">
					</div>
				</div>
			</div>


			<div class="row">


				<!-- Measured -->
				<div class="col">
					<div class="row">
						<h2 class="text-center">Measured</h2>
					</div>
					<div class="row">
						<label for="degreeOfCurve" class="form-label">Degree of Curve</label>
						<input type="number" class="form-control" id="degreeOfCurve"
							placeholder="Enter degree of curve">
					</div>

					<div class="row">
						<label for="measuredRise" class="form-label">Measured Rise (in)</label>
						<input type="number" class="form-control" id="measuredRise"
							placeholder="Enter measured rise in inches" disabled>
					</div>

					<div class="row">

						<div class="col-3">
							<!-- High Radius -->
							<div class="">
								<label for="highRadius" class="form-label">High Radius</label>
								<input type="number" class="form-control" id="highRadius"
									placeholder="Enter high radius">
							</div>

							<!-- Center Radius -->
							<div class="">
								<label for="centerRadius" class="form-label">Center Radius</label>
								<input type="number" class="form-control" id="centerRadius"
									placeholder="Enter center radius">
							</div>

							<!-- Low Radius -->
							<div class="">
								<label for="lowRadius" class="form-label">Low Radius</label>
								<input type="number" class="form-control" id="lowRadius" placeholder="Enter low radius">
							</div>
						</div>

						<div class="col-9">
							<img src="16deg1301.svg" alt="16 Degree 1301 Panel" class="img-fluid" />
						</div>

					</div>


					<div class="row">

						<table class="table table-striped">
							<thead>
								<tr>
									<th scope="col"></th>
									<th scope="col">Radius</th>
									<th scope="col">Chord</th>
									<th scope="col">Arc Length</th>
									<th scope="col">Cut Length</th>
								</tr>
							</thead>
							<tbody>
								<tr>
									<th scope="row">R6</th>
									<td id="measured-r6-radius">-</td>
									<td id="measured-r6-chord">-</td>
									<td id="measured-r6-arc">-</td>
									<td id="measured-r6-cut">-</td>
								</tr>
								<tr>
									<th scope="row">R5</th>
									<td id="measured-r5-radius">-</td>
									<td id="measured-r5-chord">-</td>
									<td id="measured-r5-arc">-</td>
									<td id="measured-r5-cut">-</td>
								</tr>
								<tr>
									<th scope="row">R4</th>
									<td id="measured-r4-radius">-</td>
									<td id="measured-r4-chord">-</td>
									<td id="measured-r4-arc">-</td>
									<td id="measured-r4-cut">-</td>
								</tr>
								<tr>
									<th scope="row">R3</th>
									<td id="measured-r3-radius">-</td>
									<td id="measured-r3-chord">-</td>
									<td id="measured-r3-arc">-</td>
									<td id="measured-r3-cut">-</td>
								</tr>
								<tr>
									<th scope="row">R2</th>
									<td id="measured-r2-radius">-</td>
									<td id="measured-r2-chord">-</td>
									<td id="measured-r2-arc">-</td>
									<td id="measured-r2-cut">-</td>
								</tr>
								<tr>
									<th scope="row">R1</th>
									<td id="measured-r1-radius">-</td>
									<td id="measured-r1-chord">-</td>
									<td id="measured-r1-arc">-</td>
									<td id="measured-r1-cut">-</td>
								</tr>
							</tbody>
						</table>

					</div>

				</div>


			</div>
		</div>
	</main>
	<footer class="d-flex justify-content-between">
		<small>
			©
			<script>document.write(new Date().getFullYear())</script> Magnum Manufacturing. All Rights Reserved.
		</small>
		<div>
			<label>
				<input type="radio" name="color-scheme" value="light dark">
				System
			</label>
			<label>
				<input type="radio" name="color-scheme" value="light">
				Light
			</label>
			<label>
				<input type="radio" name="color-scheme" value="dark">
				Dark
			</label>
		</div>
	</footer>
	<script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
		crossorigin="anonymous"></script>
	<script src="radius2degree.js"></script>
</body>

</html>
